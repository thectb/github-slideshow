timezone:    Europe/Berlin
future:      false
# baseurl:     "/github-slideshow"
highlighter: rouge
markdown:    kramdown
lsi:         false
permalink:   "/:title"

kramdown:
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jemoji

title:       github-slideshow
author:      GitHubTeacher
description: A fun activity for learning Git and GitHub.

sass:
  style:     :compressed

solarized:
  theme:     dark

slideNumber:
  format:    "c/t"

reveal:
  controls: false
  progress: true
  #slideNumber: false
  history: true
  keyboard: true
  overview: true
  center: true
  touch: true
  loop: false
  #rtl: false
  fragments: true
  #embedded: false
  #autoSlide: 0
  #autoSlideStoppable: true
  #mouseWheel: false
  #hideAddressBar: true
  #previewLinks: false
  transition: linear
  #transitionSpeed: default
  backgroundTransition: slide
  #viewDistance: 3
  #parallaxBackgroundImage: ''
  #parallaxBackgroundSize: ''
  width: 1000
  height: 920
  margin: 0.1
  minScale: 0.2
  maxScale: 1.5

exclude: [
  "Gemfile",
  "Gemfile.lock",
  "vendor",
  "reveal.js/test",
  "reveal.js/index.html",
  "reveal.js/README.md",
  "reveal.js/bower.json",
  "reveal.js/Gruntfile.js",
  "reveal.js/CONTRIBUTING.md",
  "reveal.js/LICENSE",
  "reveal.js/package.json"
]
