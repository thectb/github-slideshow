; PHP-FPM Pool Configuration for 3GB RAM Server
; This configuration prevents memory exhaustion on low-memory servers
;
; DEPLOYMENT: Copy to /etc/php/8.3/fpm/pool.d/www.conf
; Then run: systemctl restart php8.3-fpm

[www]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Manager Configuration
; CRITICAL: Use 'ondemand' to spawn processes only when needed
pm = ondemand

; Maximum number of child processes
; CALCULATION: 3GB RAM - 500MB (system) - 300MB (MySQL) = 2.2GB available
; Each PHP-FPM process uses ~160MB
; 2200MB / 160MB = ~13 processes max
; Setting to 8 for safety margin (1.3GB max)
pm.max_children = 8

; Number of seconds after which an idle process will be killed
pm.process_idle_timeout = 10s

; Maximum requests per child before respawn (prevents memory leaks)
pm.max_requests = 500

; Status page for monitoring
pm.status_path = /php-fpm-status

; Slow request logging
request_slowlog_timeout = 5s
slowlog = /var/log/php8.3-fpm-slow.log

; Resource limits
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 30
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 10M

; Error logging
php_admin_value[error_log] = /var/log/php8.3-fpm-errors.log
php_admin_flag[log_errors] = on
